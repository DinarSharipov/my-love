name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dinarsharipov/my-love

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=${IMAGE_NAME,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment manifest and environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          TELEGRAM_INTEGRATION_SECRET: ${{ secrets.TELEGRAM_INTEGRATION_SECRET }}
          TELEGRAM_PROVIDER: http
          TELEGRAM_DELIVERY_URL: https://bot.185.227.144.160.sslip.io/internal/telegram/deliver
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_PRESIGNED_URL_EXPIRES_IN: ${{ secrets.S3_PRESIGNED_URL_EXPIRES_IN }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          for required_var in S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY REDIS_PASSWORD; do
            if [ -z "${!required_var}" ]; then
              echo "Production environment secret ${required_var} is missing."
              exit 1
            fi
          done
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'install -d -m 700 /opt/my-love'
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/my-love/docker-compose.yml"
          scp -i ~/.ssh/deploy_key deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/opt/my-love/Caddyfile"
          {
          printf '%s\n' "$PRODUCTION_ENV"
          printf 'S3_ENDPOINT=%s\n' "$S3_ENDPOINT"
          printf 'S3_REGION=%s\n' "$S3_REGION"
          printf 'S3_BUCKET=%s\n' "$S3_BUCKET"
          printf 'S3_ACCESS_KEY=%s\n' "$S3_ACCESS_KEY"
          printf 'S3_SECRET_KEY=%s\n' "$S3_SECRET_KEY"
          printf 'S3_PRESIGNED_URL_EXPIRES_IN=%s\n' "$S3_PRESIGNED_URL_EXPIRES_IN"
          printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf '%s\n' 'TELEGRAM_INTEGRATION_ENABLED=true'
          printf 'TELEGRAM_INTEGRATION_SECRET=%s\n' "$TELEGRAM_INTEGRATION_SECRET"
          printf 'TELEGRAM_PROVIDER=%s\n' "$TELEGRAM_PROVIDER"
          printf 'TELEGRAM_DELIVERY_URL=%s\n' "$TELEGRAM_DELIVERY_URL"
          } | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            umask 077
            tmp_env=$(mktemp /opt/my-love/.env.XXXXXX)
            cat > "$tmp_env"
            mv "$tmp_env" /opt/my-love/.env
          '
      - name: Pull, migrate and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/my-love && APP_IMAGE='$APP_IMAGE' docker compose pull && APP_IMAGE='$APP_IMAGE' docker compose run --rm api npx prisma migrate deploy && (APP_IMAGE='$APP_IMAGE' docker compose up -d --remove-orphans && docker image prune -f || (docker compose logs --tail=100 api; exit 1))"
      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent 'https://api.147.45.124.221.sslip.io/api/v1/health' >/dev/null; then exit 0; fi
            sleep 2
          done
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/my-love && docker compose logs --tail=100 api caddy'
          exit 1
