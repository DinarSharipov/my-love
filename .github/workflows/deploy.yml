name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dinarsharipov/my-love

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=${IMAGE_NAME,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment manifest and environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          TELEGRAM_INTEGRATION_SECRET: ${{ secrets.TELEGRAM_INTEGRATION_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'install -d -m 700 /opt/my-love'
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/my-love/docker-compose.yml"
          scp -i ~/.ssh/deploy_key deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/opt/my-love/Caddyfile"
          {
            printf '%s\n' "$PRODUCTION_ENV"
            printf '%s\n' 'TELEGRAM_INTEGRATION_ENABLED=true'
            printf 'TELEGRAM_INTEGRATION_SECRET=%s\n' "$TELEGRAM_INTEGRATION_SECRET"
          } | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            umask 077
            tmp_env=$(mktemp /opt/my-love/.env.XXXXXX)
            cat > "$tmp_env"
            source_env=/opt/my-love/.env
            s3_lines=
            if ! grep -q "^S3_" "$source_env" 2>/dev/null; then
              backup_env=$(ls -1t /opt/my-love/.env.bak-* 2>/dev/null | head -n 1 || true)
              if [ -n "$backup_env" ]; then
                s3_lines=$(grep "^S3_" "$backup_env" 2>/dev/null || true)
                if [ -z "$s3_lines" ]; then
                  helper_container=$(docker ps -aq --filter name=my-love-production-postgres-1 | head -n 1 || true)
                  helper_image=$(docker inspect "$helper_container" --format '{{.Config.Image}}' 2>/dev/null || true)
                  if [ -n "$helper_image" ]; then
                    reader_container=$(docker create --entrypoint /bin/sh "$helper_image" -c 'sleep 30' 2>/dev/null || true)
                    if [ -n "$reader_container" ] && docker cp "$backup_env" "$reader_container:/tmp/env-backup" >/dev/null 2>&1; then
                      docker start "$reader_container" >/dev/null
                      s3_lines=$(docker exec "$reader_container" /bin/sh -c 'grep "^S3_" /tmp/env-backup' 2>/dev/null || true)
                      docker rm -f "$reader_container" >/dev/null 2>&1 || true
                    elif [ -n "$reader_container" ]; then
                      docker rm -f "$reader_container" >/dev/null 2>&1 || true
                    fi
                  fi
                fi
                if [ -z "$s3_lines" ]; then
                  helper_image=$(docker compose config --images 2>/dev/null | grep -E 'postgres|alpine' | head -n 1 || true)
                  if [ -n "$helper_image" ]; then
                    s3_lines=$(docker run --rm --entrypoint /bin/sh -v "$backup_env:/backup:ro" "$helper_image" -c 'grep "^S3_" /backup' 2>/dev/null || true)
                  fi
                fi
              fi
            else
              s3_lines=$(grep "^S3_" "$source_env" || true)
            fi
            if [ -n "$s3_lines" ]; then
              grep -v "^S3_" "$tmp_env" > "${tmp_env}.base"
              printf '%s\n' "$s3_lines" >> "${tmp_env}.base"
              mv "${tmp_env}.base" "$tmp_env"
            else
              echo 'Deployment env is missing S3_* variables and no readable backup was found.' >&2
              rm -f "$tmp_env"
              exit 1
            fi
            mv "$tmp_env" /opt/my-love/.env
          '
      - name: Pull, migrate and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/my-love && APP_IMAGE='$APP_IMAGE' docker compose pull && APP_IMAGE='$APP_IMAGE' docker compose run --rm api npx prisma migrate deploy && (APP_IMAGE='$APP_IMAGE' docker compose up -d --remove-orphans && docker image prune -f || (docker compose logs --tail=100 api; exit 1))"
      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent 'https://api.147.45.124.221.sslip.io/api/v1/health' >/dev/null; then exit 0; fi
            sleep 2
          done
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/my-love && docker compose logs --tail=100 api caddy'
          exit 1
      - name: Register Telegram webhook
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          bot_token=$(printf '%s\n' "$PRODUCTION_ENV" | sed -n 's/^TELEGRAM_BOT_TOKEN=//p' | tail -n 1)
          webhook_secret=$(printf '%s\n' "$PRODUCTION_ENV" | sed -n 's/^TELEGRAM_WEBHOOK_SECRET=//p' | tail -n 1)
          if [ -z "$bot_token" ] || [ -z "$webhook_secret" ]; then
            echo 'Telegram webhook skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_WEBHOOK_SECRET is absent from PRODUCTION_ENV.'
            exit 0
          fi
          curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${bot_token}/setWebhook" \
            -H 'content-type: application/json' \
            --data "$(WEBHOOK_SECRET="$webhook_secret" node -e 'console.log(JSON.stringify({url:"https://bot.147.45.124.221.sslip.io/webhook",secret_token:process.env.WEBHOOK_SECRET,allowed_updates:["message"]}))')" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok)process.exit(1);console.log("Telegram webhook registered")})'
